# 매일 오전 10시, 오후 10시(한국 시간)에 main → deploy 배포 PR을 자동으로 올린다.
# - 머지는 하지 않는다. PR이 올라오면 CI(lint, format)를 확인하고 직접 머지한다. 머지되면 deploy.yml 이 배포한다.
# - 배포할 변경(deploy에 없는 main의 커밋)이 없거나, 이미 열린 배포 PR이 있으면 아무것도 하지 않는다.
# - PAT(DEPLOY_PR_TOKEN)로 PR을 만든다. 기본 토큰(GITHUB_TOKEN)으로 만든 PR은 ci.yml 을 실행시키지 않기 때문이다.
# - 호출은 ref=main 으로 하므로, 이 파일이 main에 머지되어야 바뀐 내용이 반영된다.

name: Daily Deploy PR

on:
   # cron-job.org가 매일 10:00, 22:00(KST)에 GitHub API(workflow_dispatch)로 이 워크플로를 호출한다.
   # GitHub 자체 schedule은 수 시간씩 늦게 돌아서 쓰지 않는다. Actions 탭에서 수동으로도 실행할 수 있다.
   workflow_dispatch:

permissions:
   contents: read

# 같은 워크플로가 겹쳐 돌아 PR이 두 번 만들어지는 것을 막는다.
concurrency:
   group: daily-deploy-pr
   cancel-in-progress: false

jobs:
   create-pr:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Source Code
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Create deploy PR (main → deploy)
           env:
              # 저장소 Settings > Secrets and variables > Actions 에 등록한 PAT (repo 권한)
              GH_TOKEN: ${{ secrets.DEPLOY_PR_TOKEN }}
           run: |
              set -euo pipefail

              if [ -z "${GH_TOKEN:-}" ]; then
                echo "::error::DEPLOY_PR_TOKEN 시크릿이 없어요. 저장소 Secrets에 PAT를 등록해주세요."
                exit 1
              fi

              if ! git ls-remote --exit-code --heads origin deploy > /dev/null; then
                echo "::error::deploy 브랜치가 없어요."
                exit 1
              fi

              AHEAD=$(git rev-list --count origin/deploy..origin/main)
              if [ "$AHEAD" = "0" ]; then
                echo "배포할 변경이 없어요. PR을 만들지 않아요."
                exit 0
              fi

              OPEN_PR=$(gh pr list --base deploy --head main --state open --json number --jq '.[0].number // empty')
              if [ -n "$OPEN_PR" ]; then
                echo "이미 열린 배포 PR(#$OPEN_PR)이 있어요. 새로 만들지 않아요."
                exit 0
              fi

              # 제목은 기존 배포 PR과 같은 모양이다. (예: [Deploy] 26.11.17 02:15 p.m.)
              HOUR=$(TZ=Asia/Seoul date '+%H')
              if [ "$HOUR" -lt 12 ]; then MERIDIEM="a.m."; else MERIDIEM="p.m."; fi
              NOW=$(TZ=Asia/Seoul date '+%y.%m.%d %I:%M')

              # 본문은 팀 PR 템플릿과 같은 틀이다. 포함된 변경(커밋) 목록은 두 번째 "작업 상세 내용"에 채운다.
              {
                echo "## 📌 PR 요약"
                echo
                echo "- deploy 브랜치 업데이트"
                echo
                echo "## 🛠️ 작업 상세 내용"
                echo
                echo "- [ ] FEATURE"
                echo "- [ ] UPDATE/STYLE"
                echo "- [ ] BUGFIX"
                echo "- [ ] REFACTOR"
                echo "- [x] UPDATE MAIN(DEPLOY)"
                echo
                echo "## 📋 작업 상세 내용"
                echo
                git log --pretty='- %s' --max-count=50 origin/deploy..origin/main
                echo
                echo "## 🔗 PR 관련 이슈 닫기"
                echo
                echo "Closes #"
                echo
                echo "## 💬 메모"
                echo
                echo "- "
                echo
                echo "## 📸 화면 이미지 첨부"
                echo
                echo "## 🐇 코드래빗 요약(작성 불필요)"
              } > pr-body.md

              PR_URL=$(gh pr create \
                --base deploy \
                --head main \
                --title "[Deploy] ${NOW} ${MERIDIEM}" \
                --body-file pr-body.md)
              echo "배포 PR을 만들었어요: ${PR_URL}"

              # 담당자·리뷰어·라벨은 PR을 만든 뒤에 붙인다. 하나가 실패해도(라벨 이름 변경, 계정 권한 등) PR은 남도록 경고만 남긴다.
              gh pr edit "$PR_URL" --add-assignee always62442 || echo "::warning::담당자를 지정하지 못했어요."
              gh pr edit "$PR_URL" --add-reviewer aida030313-coder || echo "::warning::리뷰어를 지정하지 못했어요."
              gh pr edit "$PR_URL" --add-label Deploy || echo "::warning::Deploy 라벨을 붙이지 못했어요."
